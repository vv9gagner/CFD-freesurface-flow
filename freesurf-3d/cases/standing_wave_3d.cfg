# 3D standing wave (sloshing) in a closed rectangular tank, mode (m, n) = (1, 1).
# Linear theory: T = 2 pi / sqrt(g k tanh(k h)),  k = pi sqrt((m/Lx)^2 + (n/Ly)^2)
# (~0.787 s here, including the small correction from the air layer).
# Any key can be overridden: ./build/freesurf3d cases/standing_wave_3d.cfg mode_y=0 ny=4

case        = standing_wave

# tank [m] and grid (keep the cells roughly cubic)
Lx          = 1.0
Ly          = 0.5
Lz          = 0.5
nx          = 64
ny          = 32
nz          = 32

# initial surface: eta(x,y) = depth + amplitude * cos(mode_x pi x / Lx) * cos(mode_y pi y / Ly)
depth       = 0.25
amplitude   = 0.01
mode_x      = 1
mode_y      = 1

# water and air
rho_liquid  = 1000.0
rho_gas     = 1.2
mu_liquid   = 1.0e-3
mu_gas      = 1.8e-5
gravity     = 9.81
wall_bc     = slip        # slip | noslip

# time stepping [s]
t_end       = 10.0
cfl         = 0.3         # <= 0.5
dt_max      = 0.005
output_dt   = 0.05

# pressure solver (MIC(0)-preconditioned CG)
poisson_tol   = 1e-9
poisson_maxit = 5000

# output (frames are float16: about 0.65 MB each at 64x32x32)
output_dir  = output/standing_wave_3d
vtk_output  = 0           # ParaView files in <output_dir>/vtk (large in 3D)
print_every = 100
threads     = 0           # OpenMP threads, 0 = automatic (up to 4 performance cores)
