# Standing wave (sloshing) in a closed 2D tank, mode 1.
# Linear theory: T = 2 pi / sqrt(g k tanh(k h)), k = mode * pi / Lx  (~1.399 s here,
# including the small correction from the air layer).
# Any key can be overridden on the command line: ./build/freesurf cases/standing_wave.cfg nx=256 nz=128

case        = standing_wave

# tank [m] and grid
Lx          = 1.0
Lz          = 0.5
nx          = 128
nz          = 64

# initial surface: eta(x) = depth + amplitude * cos(mode * pi * x / Lx)
depth       = 0.25
amplitude   = 0.01
mode        = 1

# water and air
rho_liquid  = 1000.0
rho_gas     = 1.2
mu_liquid   = 1.0e-3
mu_gas      = 1.8e-5
gravity     = 9.81
wall_bc     = slip        # slip | noslip

# time stepping [s]
t_end       = 10.0
cfl         = 0.3         # <= 0.5
dt_max      = 0.005
output_dt   = 0.025

# pressure solver (MIC(0)-preconditioned CG)
poisson_tol   = 1e-9
poisson_maxit = 5000

# output
output_dir  = output/standing_wave
vtk_output  = 1           # ParaView files in <output_dir>/vtk
print_every = 100
